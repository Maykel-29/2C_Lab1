<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  :root {
    --ink: #1b1b18;
    --paper: #fbfaf7;
    --line: #dcd8cf;
    --accent: #2f5d4e;
    --accent-hover: #244a3e;
    --error: #b23b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
  }

  .mark {
    width: 34px;
    height: 34px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    margin-bottom: 28px;
    position: relative;
  }
  .mark::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  h1 {
    font-size: 26px;
    font-weight: 500;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }

  .sub {
    font-size: 14.5px;
    color: #5b584f;
    margin: 0 0 32px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  form { display: flex; flex-direction: column; gap: 18px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 12.5px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #4a473f;
  }

  input {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 93, 78, 0.12);
  }

  input:invalid[data-touched="true"] {
    border-color: var(--error);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    margin-top: -4px;
  }

  .row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    color: #4a473f;
    cursor: pointer;
  }

  .row a {
    color: var(--accent);
    text-decoration: none;
  }
  .row a:hover { text-decoration: underline; }

  button {
    margin-top: 8px;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }

  .error-msg {
    display: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    color: var(--error);
    margin-top: -6px;
  }

  .footer-note {
    margin-top: 26px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    color: #5b584f;
  }

  .footer-note a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .footer-note a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="mark"></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your account.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6">
      </div>

      <p class="error-msg" id="errorMsg">Enter a valid email and a password of at least 6 characters.</p>

      <div class="row">
        <label><input type="checkbox" id="remember" style="width:auto;"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="footer-note">Don't have an account? <a href="#">Create one</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    [email, password].forEach(input => {
      input.addEventListener('blur', () => input.setAttribute('data-touched', 'true'));
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      email.setAttribute('data-touched', 'true');
      password.setAttribute('data-touched', 'true');

      if (form.checkValidity()) {
        errorMsg.style.display = 'none';
        alert('Signed in (demo only — no backend connected).');
      } else {
        errorMsg.style.display = 'block';
      }
    });
  </script>

</body>
</html>
